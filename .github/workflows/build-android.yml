name: build-android
# 叙事工坊 · Android 版 APK 构建（Kivy/KivyMD 壳 + 复用 desktop core/seed）。
# 前置：android/app/{core,seed} 为 .gitignore 生成物，必须先在 CI 中执行
#   scripts/sync_android.sh 从仓库根单一事实源同步，再跑逻辑冒烟自测。
# 构建：不依赖第三方 docker action（其自定义 Dockerfile 构建层易碎），
#   直接在 ubuntu-latest 上 apt 装 JDK17、从 GitHub 拉取 buildozer master，
#   buildozer 自动下载 Android SDK/NDK（~/.buildozer 做 cache 加速）。
# 产出：推送 v* 标签时自动发布 APK 到 GitHub Releases（与 build-desktop 同模式）。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (KivyMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 同步共享源码与种子数据（core + seed 生成到 android/app/）
        run: bash scripts/sync_android.sh

      - name: 控制器逻辑冒烟（纯 python3 全链路自测，快速失败门禁）
        run: python3 scripts/selftest_android.py

      - name: 安装 JDK 17 与构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libltdl-dev unzip zip
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: 安装 Buildozer（从 GitHub 拉取 master，p4a 需 Cython<3）
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "Cython<3.0"
          python3 -m pip install --user git+https://github.com/kivy/buildozer.git@master
          export PATH="$HOME/.local/bin:$PATH"
          buildozer --version

      - name: 缓存 Buildozer 全局目录（SDK/NDK，按 spec 变更失效）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}

      - name: 预制 patched p4a（#3180 + grp 禁用补丁）
        # p4a 的 arch.get_env() 从零构建 env 白名单（仅透传 HOME/PATH/CCACHE_*），
        # workflow 里 export 的 ac_cv 变量到不了 configure —— 必须改 p4a 源码层。
        # 方案：clone develop → reset --hard 到 #3180（CPython 3.11.13 + NDK r28c）
        #   → 打入 android/p4a_disable_grp.patch（在 python3 recipe 的 configure_args
        #   注入 ac_cv_func_getgrgid(_r)=no，configure 命令行参数不受 env 白名单限制）。
        # spec 的 p4a.source_dir 指向本目录：source_dir 模式下 buildozer 跳过全部
        # git 操作（不 clone/reset/clean），直接用这份已打补丁的源码。
        run: |
          P4A_DIR="$HOME/p4a"
          if [ ! -d "$P4A_DIR/.git" ]; then
            git clone --quiet -b develop --single-branch \
              https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          git -C "$P4A_DIR" fetch --quiet origin develop
          git -C "$P4A_DIR" reset --hard 6b66944a2f51e0c848c7ac51e04a771324067ecc
          git -C "$P4A_DIR" apply --check "$GITHUB_WORKSPACE/android/p4a_disable_grp.patch" \
            && git -C "$P4A_DIR" apply "$GITHUB_WORKSPACE/android/p4a_disable_grp.patch"
          echo "patched p4a ready: $P4A_DIR @ $(git -C "$P4A_DIR" rev-parse --short HEAD)"
          grep -n 'ac_cv_func_getgrgid' "$P4A_DIR/pythonforandroid/recipes/python3/__init__.py" | head -3

      - name: Buildozer 构建 debug APK（spec 位于 android/）
        working-directory: android
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # grp 禁用已由预制 p4a 的 configure_args 注入（见 p4a_disable_grp.patch），
          # 此处不再 export ac_cv（p4a env 白名单机制下 export 根本到不了 configure）。
          # 清掉 python3 上次失败残留的 configure 产物：p4a 仅在 android-build/
          # 无 config.status 时才重跑 configure，残留会让新 configure_args 不生效。
          find ~/.buildozer -maxdepth 5 -type d -name 'android-build' -path '*python3*' -exec rm -rf {} + 2>/dev/null || true
          set +e
          buildozer -v android debug > /tmp/buildozer.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            python3 - <<'PYEOF'
          import io, re
          try:
              raw = io.open('/tmp/buildozer.log', encoding='utf-8', errors='replace').read()
              lines = raw.splitlines()
          except Exception:
              lines = []
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def emit(tag, block):
              block = block[-3400:]
              print('::error file=buildozer.spec,title=LOG %s::%s' % (tag, esc(block)))
          # 1) 原始末尾 30 行（最能反映中断点）
          tail = lines[-30:]
          if tail:
              emit('TAIL30', '\n'.join(tail))
          # 2) 精确抓 clang 诊断行（error:/fatal error:；编译命令行只有 -Werror= 无 error: 冒号，天然免疫）
          def clip(l):
              return l if len(l) <= 300 else l[:300] + '...[TRUNC]'
          err_re = re.compile(r'\berror:', re.I)
          err_idxs = [i for i, l in enumerate(lines) if err_re.search(l)]
          groups = []
          for i in err_idxs:
              if groups and i - groups[-1][-1] <= 20:
                  groups[-1].append(i)
              else:
                  groups.append([i])
          for gi, g in enumerate(groups[-5:]):
              lo = max(0, g[0] - 8)
              hi = min(len(lines), g[-1] + 3)
              emit('ERRBLK%d@L%d' % (gi + 1, g[0] + 1), '\n'.join(clip(x) for x in lines[lo:hi]))
          # 3) 总结性错误行兜底（make Error / errors generated / OOM / Traceback）
          sum_re = re.compile(r'(errors? generated|make(?:\[\d+\])?: \*\*\* .*Error \d+|# Error code:|Command failed|Killed|No space left|out of memory|SIGKILL|Traceback)', re.I)
          sidxs = [i for i, l in enumerate(lines) if sum_re.search(l)]
          for i in sidxs[-3:]:
              lo = max(0, i - 4)
              hi = min(len(lines), i + 2)
              emit('SUMM@L%d' % (i + 1), '\n'.join(clip(x) for x in lines[lo:hi]))
          PYEOF
            exit $rc
          fi

      - name: 上传 APK（Artifacts，Actions 页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: narrativeforge-android-apk
          path: android/bin/*.apk

      - name: 发布到 GitHub Releases（仅推送 v* 标签时触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          allowUpdates: true
          files: android/bin/*.apk