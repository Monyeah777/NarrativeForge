name: build-android
# 叙事工坊 · Android 版 APK 构建（Kivy/KivyMD 壳 + 复用 desktop core/seed）。
# 前置：android/app/{core,seed} 为 .gitignore 生成物，必须先在 CI 中执行
#   scripts/sync_android.sh 从仓库根单一事实源同步，再跑逻辑冒烟自测。
# 构建：不依赖第三方 docker action（其自定义 Dockerfile 构建层易碎），
#   直接在 ubuntu-latest 上 apt 装 JDK17、从 GitHub 拉取 buildozer master，
#   buildozer 自动下载 Android SDK/NDK（~/.buildozer 做 cache 加速）。
# 产出：推送 v* 标签时自动发布 APK 到 GitHub Releases（与 build-desktop 同模式）。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (KivyMD)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 同步共享源码与种子数据（core + seed 生成到 android/app/）
        run: bash scripts/sync_android.sh

      - name: 控制器逻辑冒烟（纯 python3 全链路自测，快速失败门禁）
        run: python3 scripts/selftest_android.py

      - name: 安装 JDK 17 与构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libltdl-dev libssl-dev unzip zip
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: 安装 Buildozer（从 GitHub 拉取 master，p4a 需 Cython<3）
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "Cython<3.0"
          python3 -m pip install --user git+https://github.com/kivy/buildozer.git@master
          export PATH="$HOME/.local/bin:$PATH"
          buildozer --version

      - name: 缓存 Buildozer 全局目录（SDK/NDK，按 spec 变更失效）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}

      - name: 预制 patched p4a（#3180 + grp 禁用 + PEP517 setuptools 补丁）
        # p4a 的 arch.get_env() 从零构建 env 白名单（仅透传 HOME/PATH/CCACHE_*），
        # workflow 里 export 的 ac_cv 变量到不了 configure —— 必须改 p4a 源码层。
        # 方案：clone develop → reset --hard 到 #3180（CPython 3.11.13 + NDK r28c）
        #   → 依次打入两个补丁：
        #   ① android/p4a_disable_grp.patch：在 python3 recipe 的 configure_args
        #     注入 ac_cv_func_getgrgid(_r)=no（configure 命令行参数不受 env 白名单限制）。
        #   ② android/p4a_pep517_setuptools.patch：在 build.py run_pymodules_install
        #     的 Cython 安装后向构建 venv 预装 setuptools+wheel —— kivymd 1.2.0
        #     在 PyPI 仅有 sdist 且其 pyproject.toml 无 [build-system] 表，pip 走默认
        #     setuptools.build_meta:__legacy__ 且 requires 为空（直接从当前环境 import
        #     setuptools）；6b66944 的流程只装了 Cython 从未装 setuptools，导致
        #     BackendUnavailable。预装后 PEP517 后端即可 import。
        # spec 的 p4a.source_dir 指向本目录：source_dir 模式下 buildozer 跳过全部
        # git 操作（不 clone/reset/clean），直接用这份已打补丁的源码。
        run: |
          P4A_DIR="$HOME/p4a"
          if [ ! -d "$P4A_DIR/.git" ]; then
            git clone --quiet -b develop --single-branch \
              https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          git -C "$P4A_DIR" fetch --quiet origin develop
          git -C "$P4A_DIR" reset --hard 6b66944a2f51e0c848c7ac51e04a771324067ecc
          # 补丁①：grp 禁用（CPython3.11 grp 模块编译失败修复）
          git -C "$P4A_DIR" apply --check "$GITHUB_WORKSPACE/android/p4a_disable_grp.patch" \
            && git -C "$P4A_DIR" apply "$GITHUB_WORKSPACE/android/p4a_disable_grp.patch"
          # 补丁②：PEP517 构建 venv 预装 setuptools+wheel（kivymd sdist 构建修复）
          git -C "$P4A_DIR" apply --check "$GITHUB_WORKSPACE/android/p4a_pep517_setuptools.patch" \
            && git -C "$P4A_DIR" apply "$GITHUB_WORKSPACE/android/p4a_pep517_setuptools.patch"
          echo "patched p4a ready: $P4A_DIR @ $(git -C "$P4A_DIR" rev-parse --short HEAD)"
          grep -n 'ac_cv_func_getgrgid_r=no' "$P4A_DIR/pythonforandroid/recipes/python3/__init__.py" | head -3
          grep -n 'setuptools & wheel for PEP517' "$P4A_DIR/pythonforandroid/build.py" | head -3

      - name: Buildozer 构建 debug APK（spec 位于 android/）
        working-directory: android
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # grp 禁用已由预制 p4a 的 configure_args 注入（见 p4a_disable_grp.patch），
          # 此处不再 export ac_cv（p4a env 白名单机制下 export 根本到不了 configure）。
          # 清掉 python3 上次失败残留的 configure 产物：p4a 仅在 android-build/
          # 无 config.status 时才重跑 configure，残留会让新 configure_args 不生效。
          find ~/.buildozer -maxdepth 5 -type d -name 'android-build' -path '*python3*' -exec rm -rf {} + 2>/dev/null || true
          set +e
          buildozer -v android debug > /tmp/buildozer.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # === 统一诊断段（单 heredoc） ===
            # annotation 通道有 ~10 条/job 上限：72ec2df/125b841 两轮均为 11 条
            #（10 条用户注入 + Node20 deprecation），125b841 追加的 TAIL250/ENVPROBE/
            # FINDST/KW 全部超限被静默丢弃 —— 这就是 PYEOF2 段"未生效"的根因。
            # 同时 artifact/logs 下载本地无权限（401/403）。故诊断输出改走双通道：
            #   ① diag-latest 分支 push 回仓库（完整现场，本地 git fetch 即可全量分析；
            #      workflow 只监听 main/v* 标签，不会触发循环）
            #   ② 前 6 段同时注入 ::error annotation（即时 UI 可见，避开上限）
            python3 - <<'PYDIAG'
          import io, re, os, glob, subprocess, gzip, shutil
          raw = io.open('/tmp/buildozer.log', encoding='utf-8', errors='replace').read()
          lines = raw.splitlines()
          blk = []
          def clip(l, n=300):
              return l if len(l) <= n else l[:n] + '...[TRUNC]'
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def emit(tag, body):
              body = body[-3400:]
              print('::error file=buildozer.spec,title=LOG %s::%s' % (tag, esc(body)))
          def add(tag, body):
              blk.append('\n===== %s =====\n%s' % (tag, body))
              if len(blk) <= 6:
                  emit(tag, body)
          # 1) 完整失败现场（末尾 250 行）
          add('TAIL250', '\n'.join(lines[-250:]))
          # 2) error 行聚类（clang 诊断）
          err_re = re.compile(r'\berror:', re.I)
          err_idxs = [i for i, l in enumerate(lines) if err_re.search(l)]
          groups = []
          for i in err_idxs:
              if groups and i - groups[-1][-1] <= 20:
                  groups[-1].append(i)
              else:
                  groups.append([i])
          for gi, g in enumerate(groups[-5:]):
              lo = max(0, g[0] - 8); hi = min(len(lines), g[-1] + 3)
              add('ERRBLK%d@L%d' % (gi + 1, g[0] + 1), '\n'.join(clip(x) for x in lines[lo:hi]))
          # 3) 总结性错误行
          sum_re = re.compile(r'(errors? generated|make(?:\[\d+\])?: \*\*\* .*Error \d+|# Error code:|Command failed|Killed|No space left|out of memory|SIGKILL|Traceback)', re.I)
          sidxs = [i for i, l in enumerate(lines) if sum_re.search(l)]
          for i in sidxs[-3:]:
              lo = max(0, i - 4); hi = min(len(lines), i + 2)
              add('SUMM@L%d' % (i + 1), '\n'.join(clip(x) for x in lines[lo:hi]))
          # 4) pip/PEP517 特有错误
          pip_re = re.compile(r'(subprocess-exited-with-error|BackendUnavailable|backend (?:process|call)|No module named|ModuleNotFoundError|Could not find a version|No matching distribution|ReadTimeoutError|ConnectionError|\[SSL:|CERTIFICATE_VERIFY_FAILED|ERROR: Command errored|error: subprocess|pip .* (?:failed|error))', re.I)
          pidx = [i for i, l in enumerate(lines) if pip_re.search(l)]
          for i in pidx[-3:]:
              lo = max(0, i - 6); hi = min(len(lines), i + 12)
              add('PIPERR@L%d' % (i + 1), '\n'.join(clip(x) for x in lines[lo:hi]))
          # 5) PEP517 上下文大块（BackendUnavailable / Getting build deps 前后 30 行）
          def clip2(l):
              return l if len(l) <= 1500 else l[:1500] + '...[TRUNC]'
          ctx_re = re.compile(r'(BackendUnavailable|Getting build dependencies|Installing build dependencies|Building wheel for|Getting requirements to build wheel|ERROR: Could not build wheels|Successfully built)', re.I)
          cidxs = [i for i, l in enumerate(lines) if ctx_re.search(l)]
          for i in (cidxs[:2] + cidxs[-3:]):
              lo = max(0, i - 30); hi = min(len(lines), i + 30)
              add('PEPCTX@L%d' % (i + 1), '\n'.join(clip2(x) for x in lines[lo:hi]))
          # 6) pip 安装结果关键行（install_hostpython_prerequisites 与隔离 requires 到底装了什么）
          for kw in ['Successfully installed', 'Installing collected packages', 'Collecting setuptools',
                     'Collecting wheel', 'Collecting build', 'Collecting Cython', 'Using cached setuptools',
                     'Downloading setuptools', 'Building wheel for', 'Creating isolated environment']:
              idxs = [i for i, l in enumerate(lines) if kw in l]
              for i in idxs[-2:]:
                  lo = max(0, i - 2); hi = min(len(lines), i + 4)
                  add('KW' + re.sub(r'\W', '', kw)[:20], '\n'.join(lines[lo:hi]))
          # 7) hostpython3 / android-build python3 的 setuptools import 实测
          BB = os.path.join(os.environ.get('GITHUB_WORKSPACE', '/home/runner/work/NarrativeForge/NarrativeForge'),
                            'android/.buildozer/android/platform/build-arm64-v8a/build/other_builds')
          def glob1(*parts):
              return glob.glob(os.path.join(BB, *parts))[:1]
          hp = glob1('hostpython3', '*', 'hostpython3', 'native-build', 'python3')
          ap = glob1('python3', '*', 'python3', 'android-build', 'python3')
          sp = glob1('hostpython3', '*', 'hostpython3', 'native-build', 'root', 'usr', 'local', 'lib', 'python3.11', 'site-packages')
          out = ['HP=%s' % (hp[0] if hp else 'NOT FOUND'),
                 'AP=%s' % (ap[0] if ap else 'NOT FOUND'),
                 'SP=%s' % (sp[0] if sp else 'NOT FOUND')]
          if sp:
              try:
                  items = sorted(os.listdir(sp[0]))
                  out.append('SP top-level entries (setuptools/build/wheel/pip/pyproject/virtualenv):')
                  for it in items:
                      if any(k in it for k in ('setuptools', 'build', 'wheel', 'pip', 'pyproject', 'virtualenv')):
                          out.append('  ' + it)
              except Exception as e:
                  out.append('SP list err: %s' % e)
          probe = ("import sys; print('EXE', sys.executable); print('PREFIX', sys.prefix); "
                   "print('SP0', sys.path[0] if sys.path else ''); print('PATH', '|'.join(sys.path[:8])); "
                   "import setuptools; print('SETUPTOOLS', setuptools.__version__, setuptools.__file__)")
          for tag, exe in (('HPROBE', hp), ('APROBE', ap)):
              if exe:
                  try:
                      r = subprocess.run([exe[0], '-c', probe], capture_output=True, text=True, timeout=30)
                      out.append('=== %s rc=%d ===' % (tag, r.returncode))
                      out.append((r.stdout + r.stderr)[-3300:])
                  except Exception as e:
                      out.append('%s ERR %s' % (tag, e))
          add('ENVPROBE', '\n'.join(out))
          # 8) 全盘查找 setuptools 目录（判断到底装到哪里）
          try:
              r = subprocess.run(['find', BB, '-maxdepth', '8', '-type', 'd', '-name', 'setuptools'],
                                 capture_output=True, text=True, timeout=30)
              dirs = [x for x in r.stdout.splitlines() if 'site-packages' in x][:15]
              add('FINDST', '\n'.join(dirs) if dirs else 'NO setuptools dir under site-packages in BB(maxdepth8)')
          except Exception as e:
              add('FINDST', 'find err: %s' % e)
          # 汇总写文件（完整诊断文本）
          io.open('/tmp/diag.txt', 'w', encoding='utf-8').write('\n'.join(blk))
          # 完整 buildozer.log 压缩存档（本地 fetch diag 分支后全量分析）
          try:
              with io.open('/tmp/buildozer.log', 'rb') as fi, gzip.open('/tmp/buildozer.log.gz', 'wb') as fo:
                  shutil.copyfileobj(fi, fo)
          except Exception as e:
              io.open('/tmp/gz_err.txt', 'w').write('gz err: %s' % e)
          PYDIAG
            # push 完整现场回 diag-latest 分支（不触发 workflow：on push 仅监听 main/v*）
            cp /tmp/diag.txt "$GITHUB_WORKSPACE/diag.txt" 2>/dev/null || true
            cp /tmp/buildozer.log.gz "$GITHUB_WORKSPACE/buildozer.log.gz" 2>/dev/null || true
            cp /tmp/buildozer.log "$GITHUB_WORKSPACE/buildozer.log" 2>/dev/null || true
            cd "$GITHUB_WORKSPACE"
            git config user.name "ci-diag"
            git config user.email "ci-diag@users.noreply.github.com"
            git checkout -B diag-latest 2>/dev/null || git branch -f diag-latest HEAD
            git add diag.txt buildozer.log.gz 2>/dev/null || true
            git commit --allow-empty -m "ci-diag run ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" 2>/dev/null || true
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/Monyeah777/NarrativeForge.git" HEAD:diag-latest
            exit $rc
          fi


      - name: 上传 buildozer.log（失败排障用，完整日志）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore

      - name: 上传 APK（Artifacts，Actions 页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: narrativeforge-android-apk
          path: android/bin/*.apk

      - name: 发布到 GitHub Releases（仅推送 v* 标签时触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          allowUpdates: true
          files: android/bin/*.apk