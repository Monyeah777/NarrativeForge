name: lint
# 41 波C D3：ruff 语法级静态检查（独立 job，不碰 verify.sh 零依赖红线——
# verify 用纯 unittest/stdlib；本 job 仅 CI 环境装 ruff）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff-syntax:
    name: ruff-check-e9-f63-f7-f82
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: 安装 ruff
        run: pip install -r .github/requirements-lint.txt  # 版本固定见该文件（F-05）
      - name: ruff 语法级静态检查（ruff.toml：E9/F63/F7/F82）
        run: ruff check desktop/src scripts
