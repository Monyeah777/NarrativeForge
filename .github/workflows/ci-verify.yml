name: ci-verify
# 23 方案分层治理：基础层唯一自动闸门——checkout → verify.sh（L0-L2 分层门禁，
# clone 即绿、零前置；无 sync、无 android 依赖，L3 端壳已冻结移出）。
# 绿 = FAIL=0 且 PASS 等于基线（`protocol/repo_stats.json` 是基线真源）；任一 FAIL → exit 1 → CI 红
# （发布铁律 ROADMAP §8.4 门禁）。此处**不钉**具体计数与脚本版本——钉死就会随每次波次过期，
# 而一份写着过期数字的 workflow 头，正是「本机绿、云端红」最难被发现的伪装。
# G1 修复（38 方案，2026-09-06）：7 连红根因 = check12/check18 unittest 需
# yaml + PySide6（本地有、CI 干净环境缺）——setup-python 后 pip 安装再跑 verify.sh；
# verify.sh 失败分支已加 log 回显（诊断可溯）。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify-sh-l0-l2
    runs-on: ubuntu-latest
    timeout-minutes: 60          # 挂死上限（2026-10-01 统一：CI 不许把 runner 占满 6h 默认）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 密钥明文扫描（40 总纲 S8：常见 token 前缀全量正则，命中即红）
        run: |
          if grep -rnEI --exclude-dir=.git --exclude-dir=.gitee 'ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{22,}|gho_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{20,}|AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}' .; then
            echo "::error::检测到疑似明文密钥——立即撤销该 token 并改用 secrets 注入"
            exit 1
          fi
          echo '密钥扫描通过（无常见 token 前缀命中）'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: 安装测试依赖（pyyaml + PySide6 + EGL 系统库——check12/check18 unittest 必要，G1 修复）
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          pip install -r .github/requirements-ci.txt  # 版本固定见该文件（F-05）
      - name: 分层门禁（verify.sh 全量，L0-L2 默认锁）
        run: bash verify.sh
      - name: 站点数字与真源同步（site/tools/sync-numbers.mjs：站点发布旧数字即红）
        run: node site/tools/sync-numbers.mjs
      - name: 站点离线体检（site-check.mjs --offline：JSON-LD / 机器面在场 / 抓取规则 / 无旧基址）
        run: node site/tools/site-check.mjs --offline
      - name: 门禁机器可读报告（静态可核验面：落盘 + 新鲜度校验 + 留工件）
        run: |
          python scripts/verify_report.py --write
          python scripts/verify_report.py --check
      - name: 上传门禁报告工件（机器可读结论留档）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: verification-report
          path: protocol/verification_report.json
          if-no-files-found: warn
