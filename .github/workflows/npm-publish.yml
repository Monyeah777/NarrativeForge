name: npm-publish
# 发 npm 包（v* tag 或手动触发）。来源证明（provenance）由 OIDC 签发，与 package.json 的
# publishConfig.provenance=true 同源；优先走 npm trusted publishing（无 token），有 NPM_TOKEN 时回退 token。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write          # provenance / trusted publishing 必需
jobs:
  publish:
    name: npm-publish-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 工具链自述
        run: |
          node --version
          npm --version
      - name: payload 暂存 + 发布前自检 + 冒烟
        working-directory: packaging/npm
        run: |
          npm run stage
          npm run verify
          node --test test/smoke.test.mjs
      - name: 打包并核对体积（tarball 体积是发布质量的一部分）
        working-directory: packaging/npm
        run: npm pack --dry-run
      - name: 配置 registry 认证（有 token 写 .npmrc，否则走 OIDC）
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 2026-10-07 首次运行实证：本文件此前多写了反斜杠转义 —— YAML 那一层让密钥表达式不被求值，
          # bash 那一层让变量不被展开，于是 .npmrc 里落的是字面量而不是 token，publish 必然 401/404。
          # 现在改成不转义的写法，并加一步 whoami 自检（token 坏了就当场红，不再拖到最后一步）。
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
            echo "auth=token"
            npm whoami || { echo "::error::NPM_TOKEN 无效或权限不足（whoami 失败）：建议用 Automation token，或 granular token 选 All packages: read and write"; exit 1; }
          else
            echo "auth=oidc(trusted publishing)"
          fi
      - name: 发布（带 provenance；同版本已存在即跳过 = 幂等重跑）
        working-directory: packaging/npm
        run: |
          # 幂等：重跑 workflow 时该版本已在 registry 上，再发必 409/403。跳过而不是失败——
          # "这个版本已发布" 正是重跑想要的结果（要真重发请先 bump package.json 版本）。
          V=$(node -p "require('./package.json').version")
          if npm view "ninfenz@$V" version >/dev/null 2>&1; then
            echo "::notice::ninfenz@$V 已存在于 npmjs —— 跳过发布（幂等重跑）"
          else
            npm publish --provenance --access public
          fi
          rm -f .npmrc

  publish-github-packages:
    name: npm-publish-github-packages
    # GitHub Packages 只接受 scoped 包（@owner/name），故两通道**包名不同**：
    #   npmjs.com        → ninfenz（unscoped，面向公众）
    #   GitHub Packages  → @monyeah777/ninfenz（同仓发布用 GITHUB_TOKEN，无需 PAT；scoped 名须全小写）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # 发布包到 GitHub Packages 必需
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: payload 暂存 + 发布前自检（先按 npmjs 口径自证，再改名）
        working-directory: packaging/npm
        run: |
          npm run stage
          npm run verify
      - name: 以 scoped 名发布到 GitHub Packages
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 顺序要紧：自检必须在改名**之前**跑完 —— verify-package.mjs 要求 publishConfig.provenance=true，
          # 而发到 GitHub Packages 的成品必须去掉它（该 registry 不收来源证明）。2026-10-07 首次运行
          # 正是栽在顺序上：先改名再 publish，prepack 回头重跑自检，自己把自己判红。
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@monyeah777/ninfenz';if(p.publishConfig)delete p.publishConfig.provenance;p.publishConfig=Object.assign({},p.publishConfig,{registry:'https://npm.pkg.github.com'});fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          printf '@monyeah777:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          # 幂等同上：GitHub Packages 同一版本二次发布会 409 Conflict - Cannot publish over existing version
          V=$(node -p "require('./package.json').version")
          if npm view "@monyeah777/ninfenz@$V" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@monyeah777/ninfenz@$V 已存在于 GitHub Packages —— 跳过（幂等重跑）"
          else
            npm publish --access public --ignore-scripts
          fi
          rm -f .npmrc
