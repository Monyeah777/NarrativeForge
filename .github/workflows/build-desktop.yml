name: build-desktop

# 替代原 build_windows.bat：三平台自动构建桌面工具，产出上传 Artifacts；
# 推送 v* 标签时自动发布到 GitHub Releases（社区版用户从这里下载成品 exe/dmg/AppImage 单文件产物）。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NarrativeForge-windows-x64
            exe_name: NarrativeForge.exe
          - os: macos-latest
            artifact: NarrativeForge-macos
            exe_name: NarrativeForge
          - os: ubuntu-latest
            artifact: NarrativeForge-linux
            exe_name: NarrativeForge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: PyInstaller 打包（单文件 GUI，共用 narrative_forge.spec）
        working-directory: desktop
        run: python -m PyInstaller --noconfirm packaging/narrative_forge.spec

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/${{ matrix.exe_name }}

      - name: 准备 Release 资产（平台后缀，避免 mac/Linux 同名冲突）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd desktop/dist
          case "${{ runner.os }}" in
            Windows) cp NarrativeForge.exe NarrativeForge-windows-x64.exe; echo "asset=NarrativeForge-windows-x64.exe" >> "$GITHUB_ENV" ;;
            macOS) cp NarrativeForge NarrativeForge-macos; echo "asset=NarrativeForge-macos" >> "$GITHUB_ENV" ;;
            *) cp NarrativeForge NarrativeForge-linux; echo "asset=NarrativeForge-linux" >> "$GITHUB_ENV" ;;
          esac

      - name: 发布到 Release（仅推送 v* 标签时触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          allowUpdates: true
          files: desktop/dist/${{ env.asset }}
