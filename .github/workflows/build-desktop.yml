name: build-desktop

# 替代原 build_windows.bat：三平台自动构建桌面工具，产出上传 Artifacts；
# 壳线专用（40 总纲 S6）：壳端与基础层分开节奏——仅推送 shells-v* 标签
#   （壳集中波）或手动 dispatch 时发布到 GitHub Releases（社区版用户从这里下载成品）。
# ⚠ L3 端壳冻结（23 方案分层治理）：desktop GUI 已移出主仓库演进主线，本 workflow
#   随 L3 冻结退役——基础层 v* 标签不再产壳，壳集中波一次性产出时启用。
on:
  push:
    tags: ['shells-v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NarrativeForge-windows-x64
            exe_name: NarrativeForge.exe
          - os: macos-latest
            artifact: NarrativeForge-macos
            exe_name: NarrativeForge
          - os: ubuntu-latest
            artifact: NarrativeForge-linux
            exe_name: NarrativeForge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: PyInstaller 打包（单文件 GUI，共用 narrative_forge.spec）
        working-directory: desktop
        run: python -m PyInstaller --noconfirm packaging/narrative_forge.spec

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/${{ matrix.exe_name }}

      - name: 准备 Release 资产（平台后缀，避免 mac/Linux 同名冲突）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd desktop/dist
          case "${{ runner.os }}" in
            Windows) cp NarrativeForge.exe NarrativeForge-windows-x64.exe; echo "asset=NarrativeForge-windows-x64.exe" >> "$GITHUB_ENV" ;;
            macOS) cp NarrativeForge NarrativeForge-macos; echo "asset=NarrativeForge-macos" >> "$GITHUB_ENV" ;;
            *) cp NarrativeForge NarrativeForge-linux; echo "asset=NarrativeForge-linux" >> "$GITHUB_ENV" ;;
          esac

      - name: 生成 Release 资产 sha256 校验和（S8 安全纪律）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd desktop/dist
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: 发布到 Release（仅推送 shells-v* 标签时触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          allowUpdates: true
          files: |
            desktop/dist/${{ env.asset }}
            desktop/dist/${{ env.asset }}.sha256
