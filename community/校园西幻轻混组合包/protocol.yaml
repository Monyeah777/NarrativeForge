# protocol.yaml — 第三方协议声明（校园西幻轻混组合包，v0.8.1 完整战例落盘）
# 依据 01 §6.1 Schema 模板骨架 + 02 §8.4 组合管线登记；机读真相 = 本文件，人读速览 = README.md（双源一致，check14 ⑥ / check15 ⑤ 断言）
protocol:
  schema_version: "2"          # 组合引用 Schema 版本，v2 起支持 references；bump 走 01 §7 V1/V2/V3
package:
  id: 校园西幻轻混组合包         # 包目录名（机读唯一标识，与 02 §8.4 在册一致）
  name: 校园西幻轻混组合包       # 显示名（与 README 标题一致）
  pipeline: P04                 # 自带装载管线（R3；P04 轻混装配流）
  module_id_range:              # 模块编号清单（R2 + M91-M99 规则；组合包新增编号落社区预留段）
    - "M91"                     # 自带：异界身份桥（轻混决策：情感表达通道 × 身份秘密权衡）
    - "M92"                     # 自带：轻混装配执行（跨语境再包装：生产输出 → 校园匿名馈赠）
  categories:                   # 独占类别声明（R2；[轻混] 与源包 [情感]/[生存] 无交集）
    - 轻混
  dependencies:                 # R1 依赖边界
    core_only: true             # 只依赖官方核心层
    core_modules: [M00, 通用:M10, M08, M23, 事件:M22, M06, M12, M13, M20, M24, M50, M80]   # ⊆ 官方核心 13 件（12 件配合，README §1 同）
    cross_package: []           # deprecated 兼容字段（恒空）；references 为唯一跨包引用通道（v0.8.0）
  references:                   # v2 跨包引用白名单（02 §8.4 登记判定四规则；源包资产经 asset_readonly 只读授权，不复制）
    - source_package: 校园情感领域包
      module_id: M55            # 匿名情书（校园侧情感表达通道；原模块不改号）
      source_schema_version: "2"
      asset_readonly: true      # 资产只读授权（源包资产不复制，运行时经 asset_get 借阅）
    - source_package: 西幻生存领域包
      module_id: M17            # 生产制造（西幻侧产出源；原模块不改号）
      source_schema_version: "2"
      asset_readonly: true
  modules:                      # 模块清单（与模块文档 / 02 §8.4 在册一致）
    - id: "M91"
      desc: 异界身份桥（轻混决策：情感表达通道 × 身份秘密权衡）
    - id: "M92"
      desc: 轻混装配执行（跨语境再包装：生产输出 → 校园匿名馈赠）
  assets:                       # 资产声明（I4：本包无自有资产，源包资产经 references.asset_readonly 借阅）
    count: 0                    # 内容文件数（0 个自有；assets/README.md 为借阅索引说明，非内容资产）
    readme: README.md           # 包根 README（人读速览，双源一致对照）
  mount_layers:                 # 挂载层声明（R3，对齐 02 §5 挂载点键名）
    P40 行为决策: {default: [M91], available: []}    # 轻混决策层（订 M55 情书链事件；M55 本体仍驻源包 P40 default，不搬移）
    P50 交互执行: {default: [M92], available: []}    # 轻混执行层（订 M17 production_output；M17 本体仍驻源包 P50 default，不搬移）
