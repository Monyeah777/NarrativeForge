# protocol.yaml — 第三方协议声明（通用核心基础包，v1.1.0 通用类整包战例落盘）
# 依据 01 §6.1 Schema 模板骨架 + 02 §8.3 第三方协议登记（通用核心包登记实况）；机读真相 = 本文件，人读速览 = README.md（双源一致，check14 ⑥ / check15 ⑤ 断言）
protocol:
  schema_version: "2"          # 引用 Schema 版本，v2 起支持 references；bump 走 01 §7 V1/V2/V3
package:
  id: 通用核心基础包            # 包目录名（机读唯一标识，与 02 §8.3 在册一致）
  name: 通用核心基础包          # 显示名（与 README 标题一致）
  pipeline: P05                 # 自带装载管线（R3；P05 核心基础流）
  module_id_range:              # 模块编号清单（R2 + M91-M99 规则；通用核心包新增编号落社区预留段）
    - "M93"                     # 自带：通用状态快照（依托 M00 数据槽总线）
    - "M94"                     # 自带：通用节拍桥（依托 通用:M10 时间推进）
    - "M95"                     # 自带：通用决策汇总（依托 M50 主循环调度）
    - "M96"                     # 自带：通用输出润色（依托 M80 输出生成器）
  categories:                   # 独占类别声明（R2；[通用] 与既有 [情感]/[生存]/[世界]/[事件]/[轻混] 无交集）
    - 通用
  dependencies:                 # R1 依赖边界
    core_only: true             # 只依赖官方核心层
    core_modules: [M00, 通用:M10, M08, M23, 事件:M22, M06, M12, M13, M20, M24, M50, M80]   # ⊆ 官方核心 13 件（12 件配合；官方文件不复制进包，仅依赖引用，I5 单一真相源）
    cross_package: []           # deprecated 兼容字段（恒空）；references 为唯一跨包引用通道（v0.8.0）
  references: []                # v2 跨包引用白名单（通用类整包无跨包引用，恒空；v2 必含 references 键）
  modules:                      # 模块清单（与模块文档 / 02 §8.3 在册一致）
    - id: "M93"
      desc: 通用状态快照（依托 M00：节拍收敛四类核心实体为统一快照）
    - id: "M94"
      desc: 通用节拍桥（依托 通用:M10：tick/day/minute 折算与节拍缓冲）
    - id: "M95"
      desc: 通用决策汇总（依托 M50：回合决策上下文汇总为统一简报）
    - id: "M96"
      desc: 通用输出润色（依托 M80：叙事输出通用润色与 DNA 预检）
  assets:                       # 资产声明（I4：机制包无题材资产，同轻混组合包零资产先例）
    count: 0                    # 内容文件数（0 个自有；README.md 为装载手册，非内容资产）
    readme: README.md           # 包根 README（人读速览，双源一致对照）
  mount_layers:                 # 挂载层声明（R3，对齐 02 §5 挂载点键名）
    P00 数据基座: {default: [M93], available: []}    # 快照层（订 通用:M10 节拍；M00 本体仍驻官方核心 P00，不搬移）
    P10 世界推进: {default: [M94], available: []}    # 节拍桥层（订 通用:M10 tick_day/minute_tick；M10 本体仍驻官方核心 P10）
    P40 行为决策: {default: [M95], available: []}    # 决策汇总层（订官方 M06/M13 + 本包 M93/M94 事件）
    P80 输出呈现: {default: [M96], available: []}    # 润色层（订官方 事件:M22 narrative_event + 本包 M95；M80 本体仍驻官方核心 P80）
