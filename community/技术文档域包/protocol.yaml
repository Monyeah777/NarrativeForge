# protocol.yaml — 第三方协议声明（技术文档域包，v2.1.0-C-b 战例落盘）
# 依据 01 §6.1 Schema 模板骨架 + 02 §8.3 第三方协议登记；机读真相 = 本文件，人读速览 = README.md（双源一致，check14 ⑥ / check15 ⑤ 断言）
# 定位：community 第 5 包，第一个非叙事题材域包（README「扩展新领域三步」完整战例）——techdoc 题材装配，示范从零扩展新领域。
protocol:
  schema_version: "2"          # 引用 Schema 版本，v2 起支持 references；bump 走 01 §7 V1/V2/V3
package:
  id: 技术文档域包              # 包目录名（机读唯一标识，与 02 §8.5 在册一致）
  name: 技术文档域包            # 显示名（与 README 标题一致）
  pipeline: P06                 # 自带装载管线（R3；P06 技术文档题材装配流——派生自 P90 技术文档链骨架）
  module_id_range:              # 模块编号清单（R2 + M91-M99 规则；新题材域包自带模块落社区预留段）
    - "M97"                     # 自带：术语管理（技术文档域：术语表统一）
    - "M98"                     # 自带：修订记录（技术文档域：变更追踪）
  categories:                   # 独占类别声明（R2；[技术文档] 与既有 [情感]/[生存]/[世界]/[事件]/[轻混]/[通用] 无交集）
    - 技术文档
  dependencies:                 # R1 依赖边界
    core_only: true             # 只依赖官方核心层
    core_modules: [M00, 通用:M10, M08, M23, 事件:M22, M06, M12, M13, M20, M24, M50, M80, M90]   # ⊆ 官方核心 13 件（含 M90 技术文档结构——本包题材在 M90 之上做术语/修订增强；官方文件不复制进包，仅依赖引用，I5 单一真相源）
    cross_package: []           # deprecated 兼容字段（恒空）；references 为唯一跨包引用通道（v0.8.0）
  references: []                # v2 跨包引用白名单（无跨包引用，恒空）
  modules:                      # 模块清单（与模块文档 / 02 §8.5 在册一致）
    - id: "M97"
      desc: 术语管理（技术文档域：维护 DocState.terms——术语定义/首次使用章节/统一性校验，与 M90 结构协作）
    - id: "M98"
      desc: 修订记录（技术文档域：维护 DocState.revision——版本/变更日志/回溯，与 M90 结构协作）
  assets:                       # 资产声明（I4：机制增强域包无题材资产，同通用核心基础包零资产先例）
    count: 0                    # 内容文件数（0 个自有；README.md 为装载手册，非内容资产）
    readme: README.md           # 包根 README（人读速览，双源一致对照）
  mount_layers:                 # 挂载层声明（R3，对齐 02 §5 挂载点键名；同层 default 与既有包交集为空——M97/M98 是新编号唯一 id，check15 ③ 实证见反证）
    P40 行为决策: {default: [M97], available: []}    # 术语决策层：M97 维护 DocState.terms（与 M90 P90 位协作——官方 M90 挂 P90 非 P40；校园 P40 default 含 M40/情感:M22 等，与 M97 无交集）
    P60 长期演变: {default: [M98], available: []}    # 修订层：M98 维护 DocState.revision（校园 P60 default 含 M40/M65、西幻 P60 含 生存:M10 等，与 M98 无交集）
